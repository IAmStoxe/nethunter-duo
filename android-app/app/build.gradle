plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.duotechnician.toolbox'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.duotechnician.toolbox'
        minSdk 31
        targetSdk 34
        versionCode 10000
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError true
        warningsAsErrors true
    }
}

